<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Onchi-Byte | STC89C52 Simulator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 12px;
            resize: vertical;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background: #1f2937;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .state {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .register {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
        }

        .trace {
            background: #111827;
            color: #e5e7eb;
            padding: 15px;
            border-radius: 6px;
            min-height: 150px;
            white-space: pre-line;
            font-family: monospace;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #f3f4f6;
        }

        .program-list {
            margin-top: 10px;
            font-family: monospace;
        }

        .program-line {
            padding: 5px;
        }

        .current {
            font-weight: bold;
            background: #e5e7eb;
            border-radius: 4px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ONCHI-BYTE</h1>
    <p>STC89C52 Microcontroller Simulator</p>
</header>

<div class="container">

    <div class="grid">

        <div class="card">

            <h2>Program</h2>

            <textarea id="programInput">MOV A,#05
MOV R0,#03
ADD A,#03
INC A
ANL A,#0F
SUBB A,#02
END</textarea>

            <div class="buttons">
                <button id="loadButton">LOAD</button>
                <button id="resetButton">RESET</button>
                <button id="stepButton">STEP</button>
                <button id="runButton">RUN</button>
            </div>

            <div id="programDisplay" class="program-list"></div>

        </div>

        <div class="card">

            <h2>CPU State</h2>

            <div class="state">

                <div class="register">
                    A : <span id="A">00</span>
                </div>

                <div class="register">
                    B : <span id="B">00</span>
                </div>

                <div class="register">
                    R0 : <span id="R0">00</span>
                </div>

                <div class="register">
                    R1 : <span id="R1">00</span>
                </div>

                <div class="register">
                    R2 : <span id="R2">00</span>
                </div>

                <div class="register">
                    R3 : <span id="R3">00</span>
                </div>

                <div class="register">
                    R4 : <span id="R4">00</span>
                </div>

                <div class="register">
                    R5 : <span id="R5">00</span>
                </div>

                <div class="register">
                    R6 : <span id="R6">00</span>
                </div>

                <div class="register">
                    R7 : <span id="R7">00</span>
                </div>

                <div class="register">
                    PC : <span id="PC">0000</span>
                </div>

                <div class="register">
                    SP : <span id="SP">07</span>
                </div>

                <div class="register">
                    CY : <span id="CY">0</span>
                </div>

                <div class="register">
                    Z : <span id="Z">0</span>
                </div>

            </div>

            <div class="status">
                Status:
                <strong id="status">Ready</strong>
            </div>

        </div>

    </div>

    <div class="card" style="margin-top: 20px;">

        <h2>Execution Trace</h2>

        <div id="trace" class="trace">
            Waiting for execution...
        </div>

    </div>

</div>

<script src="./script.js"></script>

<script>
    document.getElementById("loadButton")
        .addEventListener("click", loadProgram);

    document.getElementById("resetButton")
        .addEventListener("click", resetSimulator);

    document.getElementById("stepButton")
        .addEventListener("click", step);

    document.getElementById("runButton")
        .addEventListener("click", runProgram);
</script>

</body>

                             </html>
